[workspace]
resolver = "2"
members = [
    "crates/bess-core",
    "crates/bess-models",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlitalipSever/bess-emulator"

[workspace.dependencies]
bess-core = { path = "crates/bess-core", version = "0.0.1" }
bess-models = { path = "crates/bess-models", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: checkpoint restore must reproduce every f64 bit-exactly,
# and serde_json's default (faster) float parser can be off by 1 ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the domain: telemetry code casts between float and
# integer register representations constantly, and physical formulas read worse
# when reshaped to satisfy style lints.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
suboptimal_flops = "allow"
# Domain acronyms (SoC, OCV, BMS, PCS) trip the backtick heuristic in most
# doc comments; the noise outweighs the value here.
doc_markdown = "allow"
# Tick counts fit i64 for ~292 billion years; the u64 -> i64 timestamp cast
# cannot wrap in practice.
cast_possible_wrap = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The integration tests simulate whole plant-days; light optimization keeps
# them fast while debug assertions stay on.
[profile.dev]
opt-level = 1
