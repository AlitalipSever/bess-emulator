name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (warnings are errors in CI)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (physics invariants, determinism, calibration gate)
        run: cargo test --workspace
      - name: Browser build stays green
        run: cargo check -p bess-wasm --target wasm32-unknown-unknown
      - name: Signal map is in sync
        run: |
          cargo run -p bess-emulator -- --dump-signal-map /tmp/map.csv
          diff -u refmodel/gw01-signal-map.csv /tmp/map.csv
      - name: Calibration record and document agree
        run: cargo run -p bess-bench -- --check-docs

  # The milestone gate: a full replayed year in one process. It runs on its
  # own because it costs minutes rather than seconds, and it runs on every
  # pull request because a physics change that moves the annual figures is
  # exactly the change that should not reach the integration branch unnoticed.
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Annual calibration gate
        run: cargo run --release -p bess-bench -- --check
