# A container's cooling fails in the hottest week of the replayed year
# and stays down thirty hours. Block 2 keeps cycling; the discharge on
# the evening of the 14th takes its racks past the 55 C shoulder, they
# derate and the block misses its setpoint, about 1.4 MW short: one
# container is not enough to limit the site (`hvac-failure-both-units`
# is). On the third day one rack starts to leak; on day 9 it is
# isolated. An MQTT dropout on the first afternoon, with its backfill
# twenty minutes later, is the data-side trap of the same week.
schema: 1
name: hvac-failure-hot-week
taxonomy: bos
seed: 42
start: 2026-07-13T00:00:00Z
length: P10D
events:
  - at: PT14H
    target: block[2].container[0].hvac
    fault: failure
  - at: PT44H
    target: block[2].container[0].hvac
    fault: repair
  - at: P2D
    target: block[2].container[1].rack[5]
    fault: self_discharge
    rate_pct_per_month: [10, 30]
  - at: P9DT6H
    target: block[2].container[1].rack[5]
    fault: isolate
  - at: PT14H20M
    surface: mqtt
    fault: dropout
    duration: PT20M
  - at: PT14H40M
    surface: mqtt
    fault: backfill_burst
