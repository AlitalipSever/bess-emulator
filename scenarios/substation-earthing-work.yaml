# A night of work on the HV bus. At 02:05 the operator opens the HV
# breaker: the site disconnects, every converter opens its contactors and
# the house load moves to the station-service meter. The disconnectors
# open a minute later and the earthing switch closes a minute after that,
# each move an event; the interlocks would have refused any other order.
# Two hours on, the sequence runs back: earthing switch open,
# disconnectors closed, then the close command, which the breaker answers
# on the next tick, and the staggered return brings the twenty blocks back
# 30 s apart into the morning charge.
schema: 1
