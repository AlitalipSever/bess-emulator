length: PT4H
events:
  - at: PT1H
    surface: mqtt
    fault: unit_error
    duration: PT2H
    points: site
    exponent: 3
  - at: PT1H
    surface: modbus
    fault: unit_error
    duration: PT2H
    points: site
    exponent: 3
