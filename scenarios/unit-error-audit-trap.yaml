# The site's quantities arrive a thousand times too large for two hours
# on both surfaces: a gateway that scaled watts as kilowatts. On MQTT
# the values are simply wrong; on Modbus the registers saturate at their
# encoding, so a poller reads a pegged register, which is how this one
# is caught in audits. The alarm words are untouched.
schema: 1
name: unit-error-audit-trap
taxonomy: controls
seed: 7
