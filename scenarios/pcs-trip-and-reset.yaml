# Block 5's converter trips a quarter of an hour into the evening
# discharge: its PCS goes to fault, the block leaves the available set
# and the site raises its partial availability. The other nineteen take
# up its share at 105 % of their rating on their overload budgets for
# twenty minutes; then every converter falls back to its rating in one
# tick and the site, one block short, raises its limit. An operator
# reset half an hour later leaves the converter off, contactors open;
# cleared, it walks its startup sequence and runs 16 s on, and the
# block, which kept its charge, outlasts the others.
