# The grid operator curtails the plant in the evening discharge. Ten
# minutes into the full-power hour an order caps the exchange at 60 % of
# the rating for forty minutes: the target drops at once, the converters
# walk down at 10 % of rating a minute, external_limitation is raised and
# power_limited stays clear, since the plant delivers what it is asked.
# At 18:50 the order reverts on its timer, the flag clears, and the plant
# walks back up to its hour. The record carries the limit's write and
# its lift as events.
