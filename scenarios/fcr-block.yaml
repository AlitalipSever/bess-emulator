# A four-hour FCR block on a summer night, the plan idle. At midnight the
# plant holds 20 MW of primary reserve: the droop answers the synthetic
# frequency inside seconds, delivering or absorbing a few megawatts most
# of the time, the reservoir's working range (7.5 to 92.5 % for 20 MW on
# this plant) is published, and inside the dead band the manager nudges
# the state of charge toward the range's centre at up to the prequalified
# power. No alert on a night like this; the award is cleared at 04:00 and
# the droop rests.
