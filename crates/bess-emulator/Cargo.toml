[package]
name = "bess-emulator"
description = "Synthetic grid-scale battery plant emulator: Modbus TCP, MQTT, REST and WebSocket surfaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "bess-emulator"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bess-core = { workspace = true }
bess-models = { workspace = true }
clap = { version = "4.6.4", features = ["derive"] }
rumqttc = { version = "0.25.1", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp-server"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tokio-modbus = { version = "0.17.0", features = ["tcp"] }
